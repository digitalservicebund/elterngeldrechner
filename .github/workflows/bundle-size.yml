name: bundle-size

on:
  push:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-toolchain

      - name: Create Vite entry point
        run: printf '<!doctype html><html><body><script type="module" src="/src/application/index.tsx"></script></body></html>' > index.html

      - name: Build current commit
        run: npm run build:production

      - name: Record current bundle size
        run: find dist/assets -name 'index-*.js' -exec wc -c {} + | awk 'END{print "CURRENT_SIZE=" $1}' >> "$GITHUB_ENV"

      - name: Switch to previous commit
        run: git checkout HEAD~1

      - name: Build previous commit
        run: npm ci --ignore-scripts && npm run build:production

      - name: Record baseline bundle size
        run: find dist/assets -name 'index-*.js' -exec wc -c {} + | awk 'END{print "BASELINE_SIZE=" $1}' >> "$GITHUB_ENV"

      - name: Return to the pushed commit
        if: always()
        run: git checkout "$GITHUB_SHA"

      - name: Compare and notify
        run: |
          DIFF=$((CURRENT_SIZE - BASELINE_SIZE))
          if [ "$BASELINE_SIZE" -gt 0 ]; then
            PCT=$((DIFF * 100 / BASELINE_SIZE))
          else
            PCT=0
          fi
          DIFF_KB=$(awk "BEGIN {printf \"%.1f\", $DIFF / 1024}")
          CURRENT_KB=$(awk "BEGIN {printf \"%.1f\", $CURRENT_SIZE / 1024}")
          BASELINE_KB=$(awk "BEGIN {printf \"%.1f\", $BASELINE_SIZE / 1024}")
          echo "Baseline: ${BASELINE_KB} kB"
          echo "Current:  ${CURRENT_KB} kB"
          echo "Delta:    ${DIFF_KB} kB (${PCT}%)"
          if [ "${DIFF}" -gt "$((50 * 1024))" ] && [ "${PCT}" -gt 5 ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -f body=":warning: **Bundle size grew by ${PCT}% (+${DIFF_KB} kB).** Intentional from the dependency change? No action needed if so."
          fi
