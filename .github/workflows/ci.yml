name: CI

on: push

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main-deployment' || format('ci-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  static-code-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: lint
        run: npm run type-check && npm run lint && npm run stylelint

  test-suite-vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: unit test
        run: npm run test

  audit-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Audit Licenses
        run: npm run audit-licenses

  deploy-preview:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    needs:
      - test-suite-vitest
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      # Only the cache lives here; fetching the snapshot on a miss is part of
      # `deploy --preview`, which refuses to publish without it.
      - name: Restore cached app-wrapper snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .app-wrapper
          key: app-wrapper-snapshot

      - name: Deploy the preview of the main branch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
        run: mise run deploy --preview --name main

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: development
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  deploy-staging:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: staging
    needs:
      - test-suite-vitest
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Deploy to the staging environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
          VITE_BUILD_VERSION: ${{ github.sha }}
        run: mise run deploy --staging

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: staging
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  smoke-test-staging:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    needs:
      - deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - uses: ./.github/actions/cached-playwright-setup

      - name: Update package lists
        run: sudo apt-get update

      - name: Install WireGuard
        run: sudo apt-get install -y wireguard-tools

      - name: Refresh CA trust store
        run: sudo apt-get update && sudo apt-get install -y --reinstall ca-certificates && sudo update-ca-certificates

      - name: Write the tunnel config
        run: printf '%s\n' "$WIREGUARD_CONFIG" > "$RUNNER_TEMP/wg0.conf"
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}

      - name: Restrict the config permissions
        run: chmod 600 "$RUNNER_TEMP/wg0.conf"

      - name: Bring up the tunnel
        run: sudo wg-quick up "$RUNNER_TEMP/wg0.conf"

      - name: VPN connectivity check
        run: curl -I --max-time 20 https://preview-stage.bmbfsfj.bund.de/familienportal/rechner-antraege/elterngeldrechner/egr

      - name: Smoke test
        run: npm run test:smoke
        env:
          ENVIRONMENT_URL: https://preview-stage.bmbfsfj.bund.de/familienportal/rechner-antraege/elterngeldrechner/
          EXPECTED_BUILD: ${{ github.sha }}

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

  deploy-production:
    runs-on: ubuntu-24.04
    if: startsWith(github.event.ref, 'refs/tags/')
    environment: production
    needs:
      - test-suite-vitest
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Deploy to the production environment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
          VITE_BUILD_VERSION: ${{ github.sha }}
        run: mise run deploy --production

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  smoke-test-production:
    if: startsWith(github.event.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - deploy-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - uses: ./.github/actions/cached-playwright-setup

      - name: Smoke test the deployed widget on production
        run: npm run test:smoke
        env:
          ENVIRONMENT_URL: https://familienportal.de/familienportal/meta/
          EXPECTED_BUILD: ${{ github.sha }}

  create-release:
    runs-on: ubuntu-24.04
    needs:
      - smoke-test-production
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Install the tools pinned in mise.lock
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 #v4.2.4

      - name: Generate Changelog
        run: mise run release-notes > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: release-notes.md

      - name: Send release notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          payload: '{ "text": "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|Release ${{ github.ref_name }}> has been published <https://familienportal.de/familienportal/meta/egr|on the Familienportal>. :rocket:" }'
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

      - name: Report Deployment
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

      - name: Create PostHog Release Annotation
        uses: PostHog/posthog-annotate-merges-github-action@2a89e5da1131752bc7aac6861a61ba86ccf37c7f #0.2.0
        with:
          annotation-message: "Release ${{ github.ref_name }}"
          posthog-token: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          posthog-project-id: 118340
          posthog-api-host: eu.posthog.com

  generate-sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install the tools pinned in mise.lock
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 #v4.2.4

      - name: generate bill
        run: mise run generate-sbom

      - name: upload bill as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          path: sbom.spdx.json
          name: SBOM
