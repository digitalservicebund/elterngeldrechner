name: CI

on: push

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  static-code-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: lint
        run: npm run type-check && npm run lint && npm run stylelint

  test-suite-vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: test
        run: npm run test

  test-suite-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - uses: ./.github/actions/cached-playwright-setup

      - name: Run playwright e2e tests
        run: npm run test-e2e

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

  audit-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Audit Licenses
        run: npm run audit-licenses

  original-rechner-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - run: |
          git diff-tree --name-only -r ${{ github.sha }} \
            | grep 'original-rechner/src' && exit 1 || exit 0

  deploy-development:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - original-rechner-lock
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Run development build specific for stack it staging environment
        run: npm run build:staging
        env:
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_STAGING_PROJECT_TOKEN }}
          VITE_BASE_PATH: https://egr-assets-staging.object.storage.eu01.onstackit.cloud/preview/main/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"
          VITE_FEATURE_FLAG_POSTHOG: "true"

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_STAGING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_STAGING_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: aws s3 sync dist/ "s3://egr-assets-staging/preview/main" --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: development
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  deploy-staging:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - original-rechner-lock
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Run build specific for stack it staging environment
        run: npm run build:staging
        env:
          VITE_BASE_PATH: https://egr-assets-staging.object.storage.eu01.onstackit.cloud/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_STAGING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_STAGING_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: |
          aws s3 cp dist/documents/ s3://egr-assets-staging/documents/ --recursive
          aws s3 cp dist/images/ s3://egr-assets-staging/images/ --recursive

          aws s3 cp dist/assets/index-*.js s3://egr-assets-staging/index.js --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          aws s3 cp dist/assets/index-*.css s3://egr-assets-staging/index.css --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: staging
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  deploy-production:
    runs-on: ubuntu-24.04
    if: startsWith(github.event.ref, 'refs/tags/')
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - original-rechner-lock
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Run build specific for stack it production environment
        run: npm run build:production
        env:
          VITE_BASE_PATH: https://egr-assets-production.object.storage.eu01.onstackit.cloud/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_PRODUCTION_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_PRODUCTION_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: |
          aws s3 cp dist/documents/ s3://egr-assets-production/documents/ --recursive
          aws s3 cp dist/images/ s3://egr-assets-production/images/ --recursive

          aws s3 cp dist/assets/index-*.js s3://egr-assets-production/index.js --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          aws s3 cp dist/assets/index-*.css s3://egr-assets-production/index.css --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Upload build artifacts for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: production-build
          path: dist/assets/index-*
          retention-days: 1

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  build-familienportal:
    runs-on: ubuntu-24.04
    if: startsWith(github.event.ref, 'refs/tags/')
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - original-rechner-lock
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Run build (legacy) for familienportal environment
        run: npm run build:production
        env:
          VITE_BASE_PATH: /resource/
          VITE_FEATURE_FLAG_FAMILIENPORTAL_ASSET_STORAGE: "true"

      - name: Collect legacy bundle
        run: |
          mkdir -p familienportal-build
          for f in dist/assets/index-*.js dist/assets/index-*.css; do
            mv "$f" "${f/dist\/assets\/index-/familienportal-build\/index-abfrageteil-legacy-}"
          done

      - name: Run build (next) for familienportal environment
        run: npm run build:production
        env:
          VITE_BASE_PATH: /resource/
          VITE_FEATURE_FLAG_FAMILIENPORTAL_ASSET_STORAGE: "true"
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"

      - name: Collect next bundle
        run: |
          for f in dist/assets/index-*.js dist/assets/index-*.css; do
            mv "$f" "${f/dist\/assets\/index-/familienportal-build\/index-abfrageteil-next-}"
          done

      - name: Upload familienportal build artifacts for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: familienportal-build
          path: familienportal-build/index-*
          retention-days: 1

  create-release:
    runs-on: ubuntu-24.04
    needs:
      - deploy-production
      - build-familienportal
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: production-build
          path: production-build

      - name: Download familienportal build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: familienportal-build
          path: familienportal-build

      - name: Generate Changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 #v4.8.0
        id: changelog
        with:
          args: --latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.content }}
          files: |
            familienportal-build/index-*.js
            familienportal-build/index-*.css

      - name: Report Deployment
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

      - name: Create Metabase Release Event
        env:
          METABASE_API_KEY: ${{ secrets.EGR_METABASE_API_KEY }}
          METABASE_DOMAIN: ${{ secrets.EGR_METABASE_DOMAIN }}
          RELEASE_NAME: "Release ${{ github.ref_name }}"
        run: |
          TIMESTAMP=$(date --utc +"%Y-%m-%dT%H:%M:%S.000+00:00")
          curl -X POST "https://${METABASE_DOMAIN}/api/timeline-event/" \
            -H "x-api-key: $METABASE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
                  "name": "'"$RELEASE_NAME"'",
                  "description": null,
                  "timestamp": "'"$TIMESTAMP"'",
                  "timeline_id": 1,
                  "icon": "cloud",
                  "timezone": "Europe/Berlin",
                  "time_matters": false,
                  "archived": false,
                  "source": "collections"
                }'

  generate-sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: generate bill
        uses: advanced-security/generate-sbom-action@db3b07140e74d2b7d5148d6e88d909d7aed993e6 #v1.1
        id: generate-sbom

      - name: upload bill as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          path: ${{ steps.generate-sbom.outputs.fileName }}
          name: SBOM
