name: CI

on: push

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  static-code-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: lint
        run: npm run type-check && npm run lint && npm run stylelint

  test-suite-vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: test
        run: npm run test

  test-suite-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - uses: ./.github/actions/cached-playwright-setup

      - name: Restore cached app-wrapper snapshot
        id: app-wrapper-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: .app-wrapper
          key: app-wrapper-snapshot

      - name: Generate app-wrapper snapshot on cache miss
        if: steps.app-wrapper-cache.outputs.cache-hit != 'true'
        run: scripts/generate-app-wrapper.sh

      - name: Run playwright e2e tests
        run: npm run test-e2e

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

  audit-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Audit Licenses
        run: npm run audit-licenses

  audit-fallow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Fallow audit
        run: npx fallow audit --base main

  deploy-development:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Restore cached app-wrapper snapshot
        id: app-wrapper-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: .app-wrapper
          key: app-wrapper-snapshot

      - name: Generate app-wrapper snapshot on cache miss
        if: steps.app-wrapper-cache.outputs.cache-hit != 'true'
        run: scripts/generate-app-wrapper.sh || echo "::warning::app-wrapper fetch failed; preview will use the bare host page"

      - name: Run development build specific for stack it staging environment
        run: npm run build:staging
        env:
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          VITE_BASE_PATH: https://egr-assets-staging.object.storage.eu01.onstackit.cloud/preview/main/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"
          VITE_FEATURE_FLAG_POSTHOG: "true"

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: aws s3 sync dist/ "s3://egr-assets-staging/preview/main" --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: development
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  deploy-staging:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Run build specific for stack it staging environment
        run: npm run build:staging
        env:
          VITE_BASE_PATH: https://egr-assets-staging.object.storage.eu01.onstackit.cloud/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"
          VITE_BUILD_VERSION: ${{ github.sha }}

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: |
          aws s3 sync dist/assets/ s3://egr-assets-staging/assets/ --exclude "index-*.js" --exclude "index-*.css"

          aws s3 cp dist/assets/index-*.js s3://egr-assets-staging/index.js --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          aws s3 cp dist/assets/index-*.css s3://egr-assets-staging/index.css --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: staging
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  smoke-test-staging:
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    needs:
      - deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/cached-node-install

      - uses: ./.github/actions/cached-playwright-setup

      - name: Update package lists
        run: sudo apt-get update

      - name: Install WireGuard
        run: sudo apt-get install -y wireguard-tools

      - name: Write the tunnel config
        run: printf '%s\n' "$WIREGUARD_CONFIG" > "$RUNNER_TEMP/wg0.conf"
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}

      - name: Restrict the config permissions
        run: chmod 600 "$RUNNER_TEMP/wg0.conf"

      - name: Bring up the tunnel
        run: sudo wg-quick up "$RUNNER_TEMP/wg0.conf"

      - name: VPN connectivity check
        run: curl -I --max-time 20 https://preview-stage.bmbfsfj.bund.de/familienportal/rechner-antraege/elterngeldrechner/egr

      - name: Smoke test
        run: npm run test-smoke
        env:
          ENVIRONMENT_URL: https://preview-stage.bmbfsfj.bund.de/familienportal/rechner-antraege/elterngeldrechner/
          EXPECTED_BUILD: ${{ github.sha }}

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

  deploy-production:
    runs-on: ubuntu-24.04
    if: startsWith(github.event.ref, 'refs/tags/')
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs:
      - test-suite-vitest
      - test-suite-playwright
      - static-code-analysis
      - audit-licenses
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - name: Run build specific for stack it production environment
        run: npm run build:production
        env:
          VITE_BASE_PATH: https://egr-assets-production.object.storage.eu01.onstackit.cloud/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"
          VITE_BUILD_VERSION: ${{ github.sha }}

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: |
          aws s3 sync dist/assets/ s3://egr-assets-production/assets/ --exclude "index-*.js" --exclude "index-*.css"

          aws s3 cp dist/assets/index-*.js s3://egr-assets-production/index.js --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          aws s3 cp dist/assets/index-*.css s3://egr-assets-production/index.css --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

  smoke-test-production:
    if: startsWith(github.event.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs:
      - deploy-production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: ./.github/actions/cached-node-install

      - uses: ./.github/actions/cached-playwright-setup

      - name: Smoke test the deployed widget on production
        run: npm run test-smoke
        env:
          ENVIRONMENT_URL: https://familienportal.de/familienportal/meta/
          EXPECTED_BUILD: ${{ github.sha }}

  create-release:
    runs-on: ubuntu-24.04
    needs:
      - smoke-test-production
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 #v4.8.0
        id: changelog
        with:
          args: --latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.content }}

      - name: Send release notification to Slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
        with:
          payload: '{ "text": "<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}|Release ${{ github.ref_name }}> has been published <https://familienportal.de/familienportal/meta/egr|on the Familienportal>. :rocket:" }'
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

      - name: Report Deployment
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a #v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}

      - name: Create PostHog Release Annotation
        uses: PostHog/posthog-annotate-merges-github-action@2a89e5da1131752bc7aac6861a61ba86ccf37c7f #0.2.0
        with:
          annotation-message: "Release ${{ github.ref_name }}"
          posthog-token: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          posthog-project-id: ${{ secrets.POSTHOG_PROJECT_ID }}
          posthog-api-host: ${{ secrets.POSTHOG_HOST }}

      - name: Create Metabase Release Event
        env:
          METABASE_API_KEY: ${{ secrets.EGR_METABASE_API_KEY }}
          METABASE_DOMAIN: ${{ secrets.EGR_METABASE_DOMAIN }}
          RELEASE_NAME: "Release ${{ github.ref_name }}"
        run: |
          TIMESTAMP=$(date --utc +"%Y-%m-%dT%H:%M:%S.000+00:00")
          curl -X POST "https://${METABASE_DOMAIN}/api/timeline-event/" \
            -H "x-api-key: $METABASE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
                  "name": "'"$RELEASE_NAME"'",
                  "description": null,
                  "timestamp": "'"$TIMESTAMP"'",
                  "timeline_id": 1,
                  "icon": "cloud",
                  "timezone": "Europe/Berlin",
                  "time_matters": false,
                  "archived": false,
                  "source": "collections"
                }'

  generate-sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: generate bill
        uses: advanced-security/generate-sbom-action@db3b07140e74d2b7d5148d6e88d909d7aed993e6 #v1.1
        id: generate-sbom

      - name: upload bill as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          path: ${{ steps.generate-sbom.outputs.fileName }}
          name: SBOM
