name: Deploy Preview

on:
  workflow_dispatch:
    inputs:
      name:
        description: The name used to publish the feature. The preview will be accessible at $domain/preview/$name.
        required: true
        type: string

  workflow_call:
    inputs:
      name:
        description: The name used to publish the feature. The preview will be accessible at $domain/preview/$name.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: ./.github/actions/cached-node-install

      - name: Restore cached app-wrapper snapshot
        id: app-wrapper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .app-wrapper
          key: app-wrapper-snapshot

      - name: Generate app-wrapper snapshot on cache miss
        if: steps.app-wrapper-cache.outputs.cache-hit != 'true'
        run: scripts/generate-app-wrapper.sh || echo "::warning::app-wrapper fetch failed; preview will use the bare host page"

      - name: Run preview build specific for stack it staging environment
        run: npm run build:staging
        env:
          VITE_BASE_PATH: https://egr-assets-staging.object.storage.eu01.onstackit.cloud/preview/${{ inputs.name }}/

      - name: Check build artifact structure
        run: scripts/check-build-artifacts.sh

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://object.storage.eu01.onstackit.cloud
          PREVIEW_NAME: ${{ inputs.name }}
        run: aws s3 sync dist/ "s3://egr-assets-staging/preview/${PREVIEW_NAME}" --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Add Preview Link to Summary
        if: success()
        env:
          PREVIEW_NAME: ${{ inputs.name }}
        run: |
          {
            echo "### Preview Deployment erfolgreich!"
            echo ""
            echo "Die Preview-Version ist jetzt unter folgendem Link erreichbar:"
            echo "[https://assets.elterngeldrechner.dev.tech.digitalservice.dev/preview/${PREVIEW_NAME}/index.html](https://assets.elterngeldrechner.dev.tech.digitalservice.dev/preview/${PREVIEW_NAME}/index.html)"
          } >> $GITHUB_STEP_SUMMARY
