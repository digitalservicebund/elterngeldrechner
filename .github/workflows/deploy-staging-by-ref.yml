name: Staging Redeploy (Tag or SHA)

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 20
    env:
      MISE_ENV: staging

    steps:
      - name: Checkout ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Build the widget for the staging environment
        run: mise run build
        env:
          VITE_BUILD_VERSION: ${{ inputs.ref }}

      - name: Check build artifact structure
        run: scripts/check-build-artifacts.sh

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync dist/assets/ "s3://${EGR_BUCKET}/assets/" --exclude "index-*.js"
          aws s3 cp dist/assets/index-*.js "s3://${EGR_BUCKET}/index.js" --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Track deployment
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a
        with:
          project: elterngeldrechner
          environment: staging
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}
