name: Deploy Preview on Staging Environment

on:
  workflow_dispatch:
    inputs:
      path:
        description: relative URL path where to put assets (e.g. '/feature/fancy-stuff')
        required: true
        type: string

  workflow_call:
    inputs:
      path:
        description: relative URL path where to put assets (e.g. '/feature/fancy-stuff')
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/cached-node-install

      - name: Run preview build specific for stack it staging environment
        run: npm run build:staging
        env:
          VITE_BASE_PATH: https://egr-assets-staging.object.storage.eu01.onstackit.cloud/preview/${{ inputs.path }}

      - name: Synchronize build output with object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_STAGING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_STAGING_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: aws s3 sync dist/ s3://egr-assets-staging/preview/${{ inputs.path }} --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Report deployment for statistics
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a
        with:
          project: elterngeldrechner
          environment: staging
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}
