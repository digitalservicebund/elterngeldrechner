name: Undeploy Preview from Staging Environment

on:
  workflow_dispatch:
    inputs:
      path:
        description: relative URL path where assets are stored (e.g. '/feature/fancy-stuff')
        required: true
        type: string

  workflow_call:
    inputs:
      path:
        description: relative URL path where to put assets (e.g. '/feature/fancy-stuff')
        required: true
        type: string

jobs:
  undeploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Remove preview deployment from object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_STAGING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_STAGING_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: aws s3 rm s3://egr-assets-staging/preview/${{ inputs.path }} --recursive
