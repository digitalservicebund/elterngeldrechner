name: Redeploy Production Release by Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag des Releases (z.B. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  redeploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: ./.github/actions/cached-node-install

      - name: Build production
        run: npm run build:production
        env:
          VITE_BASE_PATH: https://egr-assets-production.object.storage.eu01.onstackit.cloud/
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"

      - name: Deploy to production S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STACKIT_PRODUCTION_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STACKIT_PRODUCTION_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: |
          aws s3 sync dist/assets/ s3://egr-assets-production/assets/ \
            --exclude "index-*.js" \
            --exclude "index-*.css"

          aws s3 cp dist/assets/index-*.js s3://egr-assets-production/index.js \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"

          aws s3 cp dist/assets/index-*.css s3://egr-assets-production/index.css \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Track deployment
        uses: digitalservicebund/track-deployment@v1.0.0
        with:
          project: elterngeldrechner
          environment: production
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}
