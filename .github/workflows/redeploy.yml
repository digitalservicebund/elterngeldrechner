name: Redeploy Release (Tag or SHA)

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/cached-node-install

      - name: Set environment variables
        id: config
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            {
              echo "base_path=https://egr-assets-production.object.storage.eu01.onstackit.cloud/"
              echo "bucket=s3://egr-assets-production"
              echo "track_env=production"
              echo "build_cmd=npm run build:production"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "base_path=https://egr-assets-staging.object.storage.eu01.onstackit.cloud/"
              echo "bucket=s3://egr-assets-staging"
              echo "track_env=staging"
              echo "build_cmd=npm run build:staging"
            } >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: ${{ steps.config.outputs.build_cmd }}
        env:
          VITE_BASE_PATH: ${{ steps.config.outputs.base_path }}
          VITE_FEATURE_FLAG_ABFRAGETEIL_V2: "true"

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ inputs.environment == 'production' && secrets.STACKIT_PRODUCTION_ACCESS_KEY_ID || secrets.STACKIT_STAGING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ inputs.environment == 'production' && secrets.STACKIT_PRODUCTION_SECRET_ACCESS_KEY || secrets.STACKIT_STAGING_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.STACKIT_S3_ENDPOINT_URL }}
        run: |
          aws s3 sync dist/assets/ ${{ steps.config.outputs.bucket }}/assets/ \
            --exclude "index-*.js" \
            --exclude "index-*.css"

          aws s3 cp dist/assets/index-*.js ${{ steps.config.outputs.bucket }}/index.js \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"

          aws s3 cp dist/assets/index-*.css ${{ steps.config.outputs.bucket }}/index.css \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Track deployment
        uses: digitalservicebund/track-deployment@5a2815e150e1268983aac5ca04c8c046ed1b614a
        with:
          project: elterngeldrechner
          environment: ${{ steps.config.outputs.track_env }}
          metrics_deployment_webhook_url: ${{ secrets.METRICS_DEPLOYMENT_WEBHOOK_URL }}
          metrics_webhook_token: ${{ secrets.METRICS_WEBHOOK_TOKEN }}
