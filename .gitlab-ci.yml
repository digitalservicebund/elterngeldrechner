default:
  image: registry.opencode.de/digitalservicebund/elterngeldrechner/ci:2026.8.0@sha256:38f5364dfbb4f1de3b1bac70b1bd7352a7656b68a2f91697938cb79d20966aa6
  interruptible: true

variables:
  # GitLab only caches paths inside the project directory, so mise's data and
  # cache directories have to be moved there. Left at their defaults under
  # $HOME the cache block below would silently do nothing and every job
  # would download the whole toolchain again.
  MISE_DATA_DIR: $CI_PROJECT_DIR/.mise/data
  MISE_CACHE_DIR: $CI_PROJECT_DIR/.mise/cache
  npm_config_cache: $CI_PROJECT_DIR/.npm

  # mise refuses to read a config it does not trust, and there is no shell
  # activation in CI to trust it interactively. Naming the project directory
  # covers mise.toml and the mise.<environment>.toml files the deploy jobs
  # will later select with MISE_ENV.
  MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR

# The levels of the pipeline's dependency graph: nothing deploys before the
# checks pass, nothing is verified before it is deployed, and nothing is
# released before it is verified. The last three are declared ahead of the jobs
# that will fill them, since GitLab hides a stage that has no jobs.
stages:
  - test
  - deploy
  - verify
  - release

# Just the tools pinned in mise.lock, for the jobs that describe or check the
# lockfiles rather than an installed dependency tree.
.mise-tools:
  timeout: 15m
  cache:
    - &mise-cache
      key:
        prefix: mise
        files:
          - mise.lock
      paths:
        - .mise/data
  before_script: &mise-install
    - mise install --locked
    # Nothing activates mise in CI, so the shims the install just wrote have to
    # reach PATH explicitly before any task runs.
    - export PATH="$MISE_DATA_DIR/shims:$PATH"

# The same tools plus the project's dependencies, for the jobs that need that
# installed tree. Each cache is keyed on the lockfile that decides its contents,
# so a bump invalidates only the cache it affects.
.node-tools:
  extends: .mise-tools
  cache:
    - *mise-cache
    - key:
        prefix: npm
        files:
          - package-lock.json
      paths:
        - .npm
  before_script:
    - *mise-install
    - npm ci --ignore-scripts

# Every scheduled pipeline runs a single job, picked by the SCHEDULED_TASK
# variable its schedule sets. The jobs of a merge request or a push name the
# condition below instead, so a schedule cannot pull them in.
.pipeline-rules:
  not-scheduled: &not-scheduled
    - if: $CI_PIPELINE_SOURCE != "schedule"

check:
  extends: .node-tools
  stage: test
  script: mise run --continue-on-error check
  rules: *not-scheduled

audit:
  extends: .node-tools
  stage: test
  script: mise run --continue-on-error audit
  rules: *not-scheduled

# Compiles the widget without publishing it. MISE_ENV picks the build mode and
# the base path, neither of which needs bucket credentials, so this stays free
# of side effects while covering the strictest of the three modes. No entry
# point has to be prepared: the app-wrapper plugin writes index.html during the
# build and falls back to a bare host page when no snapshot is cached.
build:
  extends: .node-tools
  stage: test
  variables:
    MISE_ENV: production
  script: mise run build
  rules: *not-scheduled

# Runs on the toolchain alone: trivy builds the bill from package-lock.json, so
# installing the dependencies would only add time to the job.
generate-sbom:
  extends: .mise-tools
  stage: test
  script: mise run generate-sbom
  artifacts:
    name: sbom
    paths:
      - sbom.spdx.json
    expire_in: 30 days
  rules: *not-scheduled

# All vulnerabilities means scanning the full filesystem
# including the devDependencies on all security issue levels.
daily-vulnerability-scan:
  extends: .mise-tools
  stage: test
  script: mise run audit-all-vulnerabilities
  rules:
    - if: $SCHEDULED_TASK == "vulnerability-scan"

# Opens the dependency update merge requests, configured in renovate.json5.
# The one job that does not run in our own image: renovate installs the package
# manager it needs to rewrite a lockfile at run time, and only the image it
# ships with brings that machinery along. The digest is what pins it, the tag
# is there to read; renovate keeps both current through the gitlabci manager.
renovate:
  stage: test
  image: renovate/renovate:44.18.0@sha256:905409d573f5ef85666f7ec85bb2bc8e7ac0c1cc57d735947bc300c1c6ea2c00
  # A run that is cancelled halfway can leave branches behind that belong to no
  # merge request, so a push to main must not take this job down with it.
  interruptible: false
  variables:
    # Renovate clones the repository it works on itself, using RENOVATE_TOKEN,
    # a protected and masked project variable holding an access token with the
    # api scope. The job therefore needs no working copy of its own.
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    # Refreshing mise.lock means running `mise lock`, and with it configuration
    # from the repository, which renovate declines unless it is named here.
    # Without this a bump of a tool would land with a lockfile still pinning
    # the version before it.
    RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
    # Renovate hands the tools it calls a scrubbed environment. mise reads no
    # config it does not trust, so the variable that trusts this project has to
    # be named to survive that scrub.
    RENOVATE_ALLOWED_ENV: MISE_TRUSTED_CONFIG_PATHS
    # Keeps what renovate learned about the dependency tree between runs. Only
    # a cache, deleting it costs one slower run.
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
    RENOVATE_REPOSITORY_CACHE: enabled
  cache:
    key: renovate
    paths:
      - renovate/cache/renovate/repository
  script: renovate
  rules:
    - if: $SCHEDULED_TASK == "dependency-updates"
