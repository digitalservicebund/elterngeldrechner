# Configuration of the STACKIT production environment, loaded with MISE_ENV=production.

[env]
EGR_BUILD_MODE = "production"
EGR_BUCKET = "egr-assets-production"

# The bucket and the credentials that may write to it belong to the same
# environment, so selecting one selects the other. See fnox.toml.
FNOX_PROFILE = "production"

# Stated rather than left unset, so no local override can turn the testing
# behaviours on in a production build.
VITE_FEATURE_FLAG_POSTHOG_TESTING = "false"

VITE_BASE_PATH = "https://egr-assets-production.object.storage.eu01.onstackit.cloud/"
VITE_PUBLIC_POSTHOG_PROJECT_TOKEN = "phc_rUbW5TOq15FHTu5PoKh3g4uCJNNN7MvHu2WJPUIjEpa"
VITE_PUBLIC_POSTHOG_HOST = "https://ph-proxy.prod.tech.digitalservice.dev"
